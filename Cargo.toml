[workspace]
members = [
    "crates/frameguard-core",
    "crates/frameguard-cli",
    "desktop/src-tauri",
]
default-members = ["crates/frameguard-core", "crates/frameguard-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frameguard-core = { path = "crates/frameguard-core" }
