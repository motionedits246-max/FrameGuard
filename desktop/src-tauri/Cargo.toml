[package]
name = "frameguard-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow.workspace = true
frameguard-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
frameguard-playback = { path = "../../crates/frameguard-playback" }
